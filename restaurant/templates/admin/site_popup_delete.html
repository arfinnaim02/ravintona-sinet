{% extends "admin/base.html" %}
{% block title %}Delete Popup{% endblock %}

{% block content %}
<section class="bg-[#f5f0e6] min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-10">
    <div class="rounded-3xl bg-white border border-[#3e2723]/10 shadow-sm p-6">
      <h1 class="text-2xl font-semibold text-[#3e2723] mb-4">Delete Popup</h1>
      <p class="text-[#3e2723]/70 mb-6">
        Are you sure you want to delete this popup?
      </p>

      <form method="post" class="flex items-center gap-3">
        {% csrf_token %}
        <button type="submit"
                class="px-5 py-2.5 rounded-2xl bg-red-600 text-white font-semibold hover:brightness-110 transition">
          Delete
        </button>

        <a href="{% url 'restaurant:site_popups_list' %}"
           class="px-5 py-2.5 rounded-2xl border border-[#3e2723]/10 bg-white text-[#3e2723] hover:bg-[#f5f0e6] transition">
          Cancel
        </a>
      </form>
    </div>
  </div>
</section>
{% endblock %}
