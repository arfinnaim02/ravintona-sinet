{% extends "admin/base.html" %}
{% block title %}{% if mode == 'edit' %}Edit Popup{% else %}Add Popup{% endif %}{% endblock %}

{% block content %}
<section class="bg-[#f5f0e6] min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-10">
    <div class="rounded-3xl bg-white border border-[#3e2723]/10 shadow-sm p-6 sm:p-8">
      <h1 class="text-3xl font-semibold text-[#3e2723] mb-6">
        {% if mode == "edit" %}Edit Popup{% else %}Add Popup{% endif %}
      </h1>

      <form method="post" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="flex items-center gap-3 pt-2">
          <button type="submit"
                  class="px-5 py-2.5 rounded-2xl bg-[#3e2723] text-white font-semibold shadow-sm hover:brightness-110 transition">
            Save
          </button>

          <a href="{% url 'restaurant:site_popups_list' %}"
             class="px-5 py-2.5 rounded-2xl border border-[#3e2723]/10 bg-white text-[#3e2723] hover:bg-[#f5f0e6] transition">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
